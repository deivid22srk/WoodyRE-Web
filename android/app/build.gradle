plugins {
    id 'com.android.application'
}

// the version of the Windows build (res/woodyre.rc), so every build of a release says the same
def rc = file('../../res/woodyre.rc').text
def woodyVersion = (rc =~ /"ProductVersion",\s*"([0-9.]+)"/)[0][1]
def woodyParts = woodyVersion.tokenize('.').collect { it as int }

android {
    namespace 'io.github.jjmhalew.woodyre'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.jjmhalew.woodyre'
        minSdk 24
        targetSdk 35
        versionCode woodyParts[0] * 10000 + woodyParts[1] * 100 + woodyParts[2]
        versionName woodyVersion
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'        // phones and tablets; x86_64 for the emulator and Chromebooks
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'   // 16 KB pages (Android 15 devices, Google Play)
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // a release signed with your own key: pass -PwoodyKeystore=... -PwoodyKeyAlias=... -PwoodyKeyPassword=...;
            // without one the release APK carries the debug key, which is fine for installing it yourself
            signingConfig project.hasProperty('woodyKeystore') ? signingConfigs.create('woody') {
                storeFile file(project.woodyKeystore); storePassword project.woodyKeyPassword
                keyAlias project.woodyKeyAlias; keyPassword project.woodyKeyPassword
            } : signingConfigs.debug
        }
    }
    lint {
        abortOnError false
    }
}
