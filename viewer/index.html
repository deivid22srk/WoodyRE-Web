<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>WoodyRE level viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #14161c; --fg: #e8e8ec; --panel: rgba(20, 22, 28, .85); --accent: #ffb347; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 0; left: 0; padding: 10px 12px; background: var(--panel); border-bottom-right-radius: 8px; max-width: 320px; }
  #ui h1 { font-size: 14px; margin: 0 0 6px; color: var(--accent); }
  #ui label { display: block; margin: 2px 0; cursor: pointer; }
  #ui select, #ui input[type=range] { width: 100%; }
  #stats { position: fixed; bottom: 0; left: 0; padding: 6px 12px; background: var(--panel); border-top-right-radius: 8px; white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; }
  #list { max-height: 40vh; overflow: auto; margin-top: 6px; border-top: 1px solid #333; padding-top: 4px; }
  #list div { cursor: pointer; padding: 1px 2px; }
  #list div:hover, #list div.sel { background: #333; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>WoodyRE viewer</h1>
  <label>Level <select id="level"></select></label>
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label><input type="checkbox" id="tex" checked> textures</label>
  <label><input type="checkbox" id="vcol" checked> vertexkleuren</label>
  <label><input type="checkbox" id="inst" checked> instanties (.ins)</label>
  <label><input type="checkbox" id="world" checked> wereld (.gel)</label>
  <label>Anim <input type="range" id="anim" min="0" max="100" value="0"></label>
  <div id="list"></div>
</div>
<div id="stats"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
const camera = new THREE.PerspectiveCamera(60, 1, 1, 200000);
const controls = new OrbitControls(camera, canvas);
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(1, 2, 1); scene.add(sun);

const params = new URLSearchParams(location.search);
const levels = ['House','WWS','W1A','W1B','W2A','W2B','W2D','W3A','W3B','W3C','W3D','KWS','K1A','K1R','K2A','K2R','K3A','K3R','SWS','S1A','S1R','S2A','S2R','S3A','S3R','Blackbox','Credits','Lang'];
const sel = document.getElementById('level');
for (const l of levels) { const o = document.createElement('option'); o.value = o.textContent = l; sel.appendChild(o); }
sel.value = params.get('level') || 'W1A';
sel.onchange = () => { location.search = '?level=' + sel.value; };

let root = null, mixer = null, clips = [];
const stats = document.getElementById('stats');
const list = document.getElementById('list');

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);

function applyToggles() {
  if (!root) return;
  const wire = document.getElementById('wire').checked, tex = document.getElementById('tex').checked, vcol = document.getElementById('vcol').checked;
  const showInst = document.getElementById('inst').checked, showWorld = document.getElementById('world').checked;
  root.traverse(o => {
    if (o.isMesh) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        m.wireframe = wire;
        if (m.userData.map === undefined) m.userData.map = m.map;
        m.map = tex ? m.userData.map : null;
        m.vertexColors = vcol;
        m.needsUpdate = true;
      }
      let isInst = false; for (let a = o; a; a = a.parent) if (a.userData.instance !== undefined) { isInst = true; break; }
      o.visible = isInst ? showInst : showWorld;
    }
  });
}
for (const id of ['wire', 'tex', 'vcol', 'inst', 'world']) document.getElementById(id).onchange = applyToggles;

function frame(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const d = Math.max(size.x, size.y, size.z);
  camera.near = d / 1000; camera.far = d * 20; camera.updateProjectionMatrix();
  camera.position.copy(center).add(new THREE.Vector3(d * 0.6, d * 0.5, d * 0.6));
  controls.target.copy(center); controls.update();
}

const file = params.get('file') || ('../out/gltf/' + sel.value + '.glb');
new GLTFLoader().load(file, gltf => {
  root = gltf.scene; scene.add(root);
  clips = gltf.animations || [];
  if (clips.length) { mixer = new THREE.AnimationMixer(root); for (const c of clips) mixer.clipAction(c).play(); }
  let tris = 0, meshes = 0, nodes = 0;
  root.traverse(o => { nodes++; if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  stats.textContent = `${file}\nnodes ${nodes}  meshes ${meshes}  triangles ${tris | 0}  animaties ${clips.length}`;
  // instance list
  const items = [];
  root.traverse(o => { if (o.userData.instance !== undefined) items.push(o); });
  items.sort((a, b) => a.userData.instance - b.userData.instance);
  for (const o of items) {
    const div = document.createElement('div');
    div.textContent = `#${o.userData.instance} ${o.name}` + (o.userData.type !== undefined ? ` (type ${o.userData.type})` : '');
    div.onclick = () => { list.querySelectorAll('.sel').forEach(e => e.classList.remove('sel')); div.classList.add('sel'); frame(o); };
    list.appendChild(div);
  }
  applyToggles(); frame(root);
}, undefined, err => { stats.textContent = 'kan ' + file + ' niet laden: ' + err.message; });

const animSlider = document.getElementById('anim');
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if (mixer) {
    if (document.activeElement === animSlider) {
      const dur = Math.max(...clips.map(c => c.duration), 0.001);
      mixer.setTime(dur * animSlider.value / 100);
    } else mixer.update(dt);
  }
  controls.update(); renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
